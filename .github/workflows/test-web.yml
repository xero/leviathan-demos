name: test-web

on:
  workflow_call:
    inputs:
      bun-version:
        description: 'Bun version to install'
        required: false
        type: string
        default: '1.3.13'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version || '1.3.13' }}

      # The interop suite runs the cli from source to cross-check the wire
      # format, so the cli needs its dependencies installed.
      - name: install cli dependencies
        working-directory: cli
        run: bun install

      - name: install web dependencies
        working-directory: web
        run: bun install

      - name: install playwright chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: build demo
        working-directory: web
        run: bun bake

      - name: run tests
        working-directory: web
        run: bun check
