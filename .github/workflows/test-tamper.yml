name: test-tamper

on:
  workflow_call:
    inputs:
      bun-version:
        description: 'Bun version to install'
        required: false
        type: string
        default: '1.3.13'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version || '1.3.13' }}

      - name: install dependencies
        working-directory: tamper
        run: bun install

      - name: install playwright chromium
        working-directory: tamper
        run: bunx playwright install --with-deps chromium

      - name: build demo
        working-directory: tamper
        run: bun bake

      # bun check runs the Playwright smoke suite; its config starts the relay
      # server automatically (reuseExistingServer is off when CI=true).
      - name: run tests
        working-directory: tamper
        run: bun check
